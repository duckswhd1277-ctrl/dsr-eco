<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAT NO 자동 매칭 도구</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .section {
            display: flex;
            flex-direction: column;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .file-input {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        input[type="file"] {
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="file"]:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #666;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .preview-table {
            margin-top: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            max-height: 400px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            background: #f5f5f5;
            padding: 10px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
            white-space: nowrap;
            position: sticky;
            top: 0;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .match {
            background: #d4edda;
        }

        .nomatch {
            background: #f8d7da;
        }

        .issues {
            margin-top: 30px;
            padding: 20px;
            background: #fff3cd;
            border-radius: 6px;
            border-left: 4px solid #ffc107;
        }

        .issues h3 {
            margin-bottom: 15px;
            color: #856404;
        }

        .issue-list {
            list-style: none;
            font-size: 13px;
        }

        .issue-list li {
            padding: 8px;
            margin-bottom: 8px;
            background: white;
            border-radius: 4px;
            border-left: 3px solid #ffc107;
            padding-left: 12px;
        }

        @media (max-width: 1000px) {
            .content {
                grid-template-columns: 1fr;
            }

            .results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔄 HEAT NO 자동 매칭 도구</h1>
            <p>OT 열처리 파일의 HEAT NO를 정리파일(수출)에 자동으로 입력합니다</p>
        </div>

        <div class="content">
            <!-- 왼쪽: 파일 업로드 및 분석 -->
            <div class="section">
                <h2>1️⃣ 파일 선택 및 분석</h2>

                <div class="file-input">
                    <label>정리파일(수출).xls</label>
                    <input type="file" id="file1" accept=".xls,.xlsx" />
                </div>

                <div class="file-input">
                    <label>OT 열처리.xls</label>
                    <input type="file" id="file2" accept=".xls,.xlsx" />
                </div>

                <button onclick="analyzeFiles()">📊 파일 분석하기</button>

                <div id="status" class="status" style="display:none;"></div>

                <div id="results" class="results" style="display:none;">
                    <div class="stat-box">
                        <div class="stat-number" id="stat1">0</div>
                        <div class="stat-label">OT 열처리 항목</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="stat2">0</div>
                        <div class="stat-label">매칭 성공</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="stat3">0</div>
                        <div class="stat-label">매칭 실패</div>
                    </div>
                </div>
            </div>

            <!-- 오른쪽: 매칭 결과 -->
            <div class="section">
                <h2>2️⃣ 매칭 결과 미리보기</h2>

                <div id="previewContainer" style="display:none;">
                    <div class="preview-table">
                        <table id="previewTable">
                            <thead>
                                <tr>
                                    <th>제조번호</th>
                                    <th>거래처</th>
                                    <th>HEAT NO</th>
                                    <th>상태</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="issuesContainer" style="display:none;">
                    <div class="issues">
                        <h3>⚠️ 발견된 이슈</h3>
                        <ul class="issue-list" id="issueList"></ul>
                    </div>
                </div>

                <button onclick="downloadResult()" id="downloadBtn" style="display:none; margin-top: 20px;">
                    💾 결과 다운로드 (수정된 Excel)
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        let analysisData = null;

        async function analyzeFiles() {
            const file1 = document.getElementById('file1').files[0];
            const file2 = document.getElementById('file2').files[0];

            if (!file1 || !file2) {
                showStatus('두 파일을 모두 선택해주세요', 'error');
                return;
            }

            showStatus('파일 분석 중...', 'loading');

            try {
                const data1 = await readExcel(file1);
                const data2 = await readExcel(file2);

                analysisData = matchData(data1, data2);
                displayResults(analysisData);

                showStatus('분석 완료! 매칭 결과를 확인하세요.', 'success');
                document.getElementById('downloadBtn').style.display = 'block';
            } catch (error) {
                showStatus('오류 발생: ' + error.message, 'error');
            }
        }

        async function readExcel(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                        resolve(json);
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function matchData(data1, data2) {
            const headers1 = data1[0];
            const headers2 = data2[0];

            // 정리파일 컬럼 인덱스
            const col1_manuf = headers1.indexOf('제조번호'); // 1
            const col1_heat = headers1.indexOf('비고2(HEAT)'); // 25

            // OT 파일 컬럼 인덱스
            const col2_manuf = headers2.indexOf('제조번호'); // 5
            const col2_heat = headers2.indexOf('HEAT NO'); // 8

            const matches = [];

            for (let i = 1; i < data2.length; i++) {
                const row2 = data2[i];
                const manuf = row2[col2_manuf];
                const heatNo = row2[col2_heat];

                if (!manuf) continue;

                for (let j = 1; j < data1.length; j++) {
                    const row1 = data1[j];
                    if (row1[col1_manuf] === manuf) {
                        matches.push({
                            manufNo: manuf,
                            company: row1[4],
                            heatNo: heatNo,
                            rowIndex: j,
                            matched: true
                        });
                        break;
                    }
                }
            }

            return {
                headers1, data1,
                matches,
                colIndices: {
                    heat: col1_heat
                }
            };
        }

        function displayResults(data) {
            const matched = data.matches.length;

            document.getElementById('stat1').textContent = data.matches.length;
            document.getElementById('stat2').textContent = matched;
            document.getElementById('stat3').textContent = '0';
            document.getElementById('results').style.display = 'grid';

            // 미리보기 테이블
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            data.matches.slice(0, 10).forEach(item => {
                const row = document.createElement('tr');
                row.className = 'match';
                row.innerHTML = `
                    <td>${item.manufNo}</td>
                    <td>-</td>
                    <td>${item.company || '-'}</td>
                    <td><strong>${item.heatNo || '-'}</strong></td>
                    <td>✅ 매칭됨</td>
                `;
                tableBody.appendChild(row);
            });

            document.getElementById('previewContainer').style.display = 'block';
        }

        function downloadResult() {
            if (!analysisData) return;

            const newData = analysisData.data1.map(row => [...row]);
            const heatColIdx = analysisData.colIndices.heat;

            analysisData.matches.forEach(match => {
                newData[match.rowIndex][heatColIdx] = match.heatNo;
            });

            const ws = XLSX.utils.aoa_to_sheet(newData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "데이터");
            XLSX.writeFile(wb, `정리파일(수출)_HEAT처리_${new Date().getTime()}.xlsx`);

            showStatus('✅ 수정된 파일을 다운로드했습니다!', 'success');
        }

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
