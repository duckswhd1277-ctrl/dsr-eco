<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAT NO 자동 매칭 도구</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .section {
            display: flex;
            flex-direction: column;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .file-input {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        input[type="file"] {
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="file"]:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #666;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .preview-table {
            margin-top: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            max-height: 400px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            background: #f5f5f5;
            padding: 10px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
            white-space: nowrap;
            position: sticky;
            top: 0;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .match {
            background: #d4edda;
        }

        .nomatch {
            background: #f8d7da;
        }

        .issues {
            margin-top: 30px;
            padding: 20px;
            background: #fff3cd;
            border-radius: 6px;
            border-left: 4px solid #ffc107;
        }

        .issues h3 {
            margin-bottom: 15px;
            color: #856404;
        }

        .issue-list {
            list-style: none;
            font-size: 13px;
        }

        .issue-list li {
            padding: 8px;
            margin-bottom: 8px;
            background: white;
            border-radius: 4px;
            border-left: 3px solid #ffc107;
            padding-left: 12px;
        }

        @media (max-width: 1000px) {
            .content {
                grid-template-columns: 1fr;
            }

            .results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔄 HEAT NO 자동 매칭 도구</h1>
            <p>OT 열처리 파일의 HEAT NO를 정리파일(수출)에 자동으로 입력합니다</p>
        </div>

        <div class="content">
            <!-- 왼쪽: 파일 업로드 및 분석 -->
            <div class="section">
                <h2>1️⃣ 파일 선택 및 분석</h2>

                <div class="file-input">
                    <label>정리파일(수출).xls</label>
                    <input type="file" id="file1" accept=".xls,.xlsx" />
                </div>

                <div class="file-input">
                    <label>OT 열처리.xls</label>
                    <input type="file" id="file2" accept=".xls,.xlsx" />
                </div>

                <button onclick="analyzeFiles()">📊 파일 분석하기</button>

                <div id="status" class="status" style="display:none;"></div>

                <div id="results" class="results" style="display:none;">
                    <div class="stat-box">
                        <div class="stat-number" id="stat1">0</div>
                        <div class="stat-label">OT 열처리 항목</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="stat2">0</div>
                        <div class="stat-label">매칭 성공</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="stat3">0</div>
                        <div class="stat-label">매칭 실패</div>
                    </div>
                </div>
            </div>

            <!-- 오른쪽: 매칭 결과 -->
            <div class="section">
                <h2>2️⃣ 매칭 결과 미리보기</h2>

                <div id="debugInfo" style="display:none; background: #f0f0f0; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 12px; max-height: 150px; overflow-y: auto;">
                    <strong>🔍 디버그 정보:</strong>
                    <div id="debugContent"></div>
                </div>

                <div id="previewContainer" style="display:none;">
                    <div style="display: flex; gap: 10px; margin-bottom: 15px; align-items: center;">
                        <label style="margin: 0;">미리보기 행 수:</label>
                        <select id="previewRowCount" style="padding: 6px; border: 1px solid #e0e0e0; border-radius: 4px;">
                            <option value="5">5개</option>
                            <option value="10" selected>10개</option>
                            <option value="20">20개</option>
                            <option value="50">50개</option>
                            <option value="all">전체</option>
                        </select>
                    </div>
                    <div class="preview-table">
                        <table id="previewTable">
                            <thead>
                                <tr>
                                    <th>제조번호</th>
                                    <th>거래처</th>
                                    <th>HEAT NO</th>
                                    <th>상태</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                            </tbody>
                        </table>
                    </div>
                    <small style="color: #999; margin-top: 10px; display: block;">* 상위 10개만 표시됩니다 (전체: <span id="totalMatched">0</span>개)</small>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button onclick="downloadResult()" id="downloadBtn" style="display:none; flex: 1;">
                        💾 결과 다운로드
                    </button>
                    <button onclick="createGitHubIssue()" id="issueBtn" style="display:none; flex: 1;">
                        📝 GitHub Issue 생성
                    </button>
                    <button onclick="optimizeDoc()" id="docBtn" style="display:none; flex: 1;">
                        📄 문서 최적화
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        let analysisData = null;

        async function analyzeFiles() {
            const file1 = document.getElementById('file1').files[0];
            const file2 = document.getElementById('file2').files[0];

            if (!file1 || !file2) {
                showStatus('두 파일을 모두 선택해주세요', 'error');
                return;
            }

            showStatus('파일 분석 중...', 'loading');

            try {
                // 파일 유효성 검증
                if (file1.size === 0 || file2.size === 0) {
                    showStatus('❌ 오류: 빈 파일입니다. 유효한 Excel 파일을 선택해주세요.', 'error');
                    return;
                }

                const data1 = await readExcel(file1);
                const data2 = await readExcel(file2);

                // 데이터 유효성 검증
                if (!data1 || data1.length < 2) {
                    showStatus('❌ 오류: 정리파일(수출)이 비어있거나 형식이 잘못되었습니다.', 'error');
                    return;
                }

                if (!data2 || data2.length < 2) {
                    showStatus('❌ 오류: OT 열처리 파일이 비어있거나 형식이 잘못되었습니다.', 'error');
                    return;
                }

                // 필수 컬럼 확인
                const headers1 = data1[0];
                const headers2 = data2[0];

                if (headers1.indexOf('제조번호') === -1) {
                    showStatus('❌ 오류: 정리파일에 "제조번호" 컬럼이 없습니다.', 'error');
                    return;
                }

                if (headers2.indexOf('제조번호') === -1 || headers2.indexOf('HEAT NO') === -1) {
                    showStatus('❌ 오류: OT 열처리 파일에 필수 컬럼이 없습니다.', 'error');
                    return;
                }

                analysisData = matchData(data1, data2);
                displayResults(analysisData);

                showStatus('✅ 분석 완료! 매칭 결과를 확인하세요.', 'success');
                document.getElementById('downloadBtn').style.display = 'block';
            } catch (error) {
                showStatus('❌ 파일 처리 오류: ' + error.message, 'error');
            }
        }

        async function readExcel(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                        resolve(json);
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function matchData(data1, data2) {
            const headers1 = data1[0];
            const headers2 = data2[0];

            // 정리파일 컬럼 인덱스
            const col1_manuf = headers1.indexOf('제조번호'); // 1
            const col1_heat = headers1.indexOf('비고2(HEAT)'); // 25

            // OT 파일 컬럼 인덱스
            const col2_manuf = headers2.indexOf('제조번호'); // 5
            const col2_heat = headers2.indexOf('HEAT NO'); // 8

            const matches = [];

            for (let i = 1; i < data2.length; i++) {
                const row2 = data2[i];
                const manuf = row2[col2_manuf];
                const heatNo = row2[col2_heat];

                if (!manuf) continue;

                for (let j = 1; j < data1.length; j++) {
                    const row1 = data1[j];
                    if (row1[col1_manuf] === manuf) {
                        matches.push({
                            manufNo: manuf,
                            company: row1[4],
                            heatNo: heatNo,
                            rowIndex: j,
                            matched: true
                        });
                        break;
                    }
                }
            }

            return {
                headers1, data1,
                matches,
                colIndices: {
                    heat: col1_heat
                }
            };
        }

        function displayResults(data) {
            const matched = data.matches.length;

            document.getElementById('stat1').textContent = data.matches.length;
            document.getElementById('stat2').textContent = matched;
            document.getElementById('stat3').textContent = '0';
            document.getElementById('results').style.display = 'grid';

            // 디버그 정보 표시
            const debugContent = document.getElementById('debugContent');
            const uniqueHeatNos = new Set(data.matches.map(m => m.heatNo).filter(h => h));
            const uniqueManuf = new Set(data.matches.map(m => m.manufNo));
            const emptyHeatNos = data.matches.filter(m => !m.heatNo || m.heatNo.trim() === '').length;

            debugContent.innerHTML = `
                <div>📊 OT 열처리 데이터: ${data.matches.length}개</div>
                <div>🔗 제조번호 종류: ${uniqueManuf.size}개</div>
                <div>🌡️ HEAT NO 종류: ${uniqueHeatNos.size}개 ${emptyHeatNos > 0 ? `<span style="color: #ff6b6b;">+ 빈값 ${emptyHeatNos}개 ⚠️</span>` : ''}</div>
                <div style="margin-top: 8px; color: #666;">
                    ${Array.from(uniqueHeatNos).slice(0, 5).map(h => `<span style="display: inline-block; background: #e0e0e0; padding: 2px 6px; margin: 2px; border-radius: 3px;">${h}</span>`).join('')}
                    ${uniqueHeatNos.size > 5 ? `<span style="display: inline-block; color: #999;">... 외 ${uniqueHeatNos.size - 5}개</span>` : ''}
                    ${emptyHeatNos > 0 ? `<span style="display: inline-block; background: #ffe0e0; padding: 2px 6px; margin: 2px; border-radius: 3px; color: #ff6b6b;">[빈값]</span>` : ''}
                </div>
            `;
            document.getElementById('debugInfo').style.display = 'block';

            // 미리보기 테이블 업데이트 함수
            function updatePreviewTable() {
                const rowCount = document.getElementById('previewRowCount').value;
                const tableBody = document.getElementById('tableBody');
                tableBody.innerHTML = '';

                let sampleItems;
                if (rowCount === 'all') {
                    sampleItems = data.matches;
                } else {
                    sampleItems = getDistributedSamples(data.matches, parseInt(rowCount));
                }

                sampleItems.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = 'match';
                    row.innerHTML = `
                        <td>${item.manufNo}</td>
                        <td>${item.company || '-'}</td>
                        <td><strong>${item.heatNo || '-'}</strong></td>
                        <td>✅ 매칭됨</td>
                    `;
                    tableBody.appendChild(row);
                });
            }

            // 초기 테이블 표시
            updatePreviewTable();

            // 행 수 선택 이벤트
            document.getElementById('previewRowCount').addEventListener('change', updatePreviewTable);

            document.getElementById('totalMatched').textContent = matched;
            document.getElementById('previewContainer').style.display = 'block';
            document.getElementById('downloadBtn').style.display = 'block';
            document.getElementById('issueBtn').style.display = 'block';
            document.getElementById('docBtn').style.display = 'block';
        }

        function getDistributedSamples(items, count) {
            if (items.length <= count) return items;

            // 다양한 HEAT NO를 균등하게 샘플링
            const step = Math.floor(items.length / count);
            const samples = [];
            for (let i = 0; i < count && i * step < items.length; i++) {
                samples.push(items[i * step]);
            }
            return samples;
        }

        function downloadResult() {
            if (!analysisData) return;

            // 옵션 선택
            const option = confirm(
                '다운로드 방식을 선택하세요.\n\n' +
                '확인: 새로운 파일 (HEAT NO만 추가된 정리파일)\n' +
                '취소: 매칭 결과만 (제조번호, 거래처, HEAT NO)'
            );

            if (option) {
                downloadFullFile();
            } else {
                downloadMatchesOnly();
            }
        }

        function downloadFullFile() {
            // 원본 파일 구조 유지하며 HEAT NO만 추가
            const newData = analysisData.data1.map(row => [...row]);
            const heatColIdx = analysisData.colIndices.heat;

            analysisData.matches.forEach(match => {
                newData[match.rowIndex][heatColIdx] = match.heatNo;
            });

            const ws = XLSX.utils.aoa_to_sheet(newData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "정리파일(수출)");
            XLSX.writeFile(wb, `정리파일(수출)_HEAT처리_${new Date().getTime()}.xlsx`);

            showStatus('✅ 새로운 정리파일을 다운로드했습니다! (원본 파일 보존됨)', 'success');
        }

        function downloadMatchesOnly() {
            // 매칭 결과만 정리
            const headers = ['제조번호', '거래처', 'HEAT NO', '상태'];
            const data = [headers];

            analysisData.matches.forEach(match => {
                data.push([
                    match.manufNo,
                    match.company || '',
                    match.heatNo || '',
                    '✅ 매칭됨'
                ]);
            });

            const ws = XLSX.utils.aoa_to_sheet(data);
            // 컬럼 너비 설정
            ws['!cols'] = [
                { wch: 15 },  // 제조번호
                { wch: 20 },  // 거래처
                { wch: 15 },  // HEAT NO
                { wch: 15 }   // 상태
            ];

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "매칭결과");
            XLSX.writeFile(wb, `HEAT_NO_매칭결과_${new Date().getTime()}.xlsx`);

            showStatus('✅ 매칭 결과를 다운로드했습니다!', 'success');
        }

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }

        async function createGitHubIssue() {
            if (!analysisData || analysisData.matches.length === 0) {
                alert('분석 결과가 없습니다');
                return;
            }

            const token = prompt('GitHub Personal Access Token을 입력하세요:\n(또는 취소를 눌러서 로컬 저장)');

            if (token === null) {
                // 로컬에 Issue 정보 저장
                saveIssueLocally();
                return;
            }

            const matched = analysisData.matches.length;
            const title = `[자동화] HEAT NO 매칭 완료 - ${matched}개 항목`;
            const body = generateIssueBody(analysisData.matches);

            try {
                showStatus('GitHub Issue 생성 중...', 'loading');

                const response = await fetch('https://api.github.com/repos/duckswhd1277-ctrl/dsr-eco/issues', {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: title,
                        body: body,
                        labels: ['automation', 'HEAT-NO', 'completed']
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    showStatus(`✅ Issue #${data.number} 생성 완료!`, 'success');
                    document.getElementById('downloadBtn').style.display = 'block';
                } else {
                    const error = await response.json();
                    showStatus(`❌ 오류: ${error.message}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ 오류 발생: ${error.message}`, 'error');
            }
        }

        function saveIssueLocally() {
            const matched = analysisData.matches.length;
            const body = generateIssueBody(analysisData.matches);

            const issueContent = `# [자동화] HEAT NO 매칭 완료 - ${matched}개 항목\n\n${body}`;

            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(issueContent));
            element.setAttribute('download', 'github_issue.txt');
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);

            showStatus('✅ Issue 정보를 파일로 다운로드했습니다', 'success');
        }

        function generateIssueBody(matches) {
            const matched = matches.length;
            const sampleRows = matches.slice(0, 5);

            let body = `## 📊 HEAT NO 자동 매칭 완료\n\n`;
            body += `**매칭 결과:**\n`;
            body += `- ✅ 성공: ${matched}개 항목\n`;
            body += `- 📁 파일: 정리파일(수출).xls\n`;
            body += `- 🔗 매칭 기준: 제조번호\n\n`;

            body += `**매칭 샘플 (상위 5개):**\n`;
            body += `| 제조번호 | 거래처 | HEAT NO |\n`;
            body += `|---------|--------|--------|\n`;

            sampleRows.forEach(item => {
                body += `| ${item.manufNo} | ${item.company || '-'} | ${item.heatNo} |\n`;
            });
