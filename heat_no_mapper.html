<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAT NO 자동 매칭 도구</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .section {
            display: flex;
            flex-direction: column;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .file-input {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        input[type="file"] {
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="file"]:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #666;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .preview-table {
            margin-top: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            max-height: 400px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            background: #f5f5f5;
            padding: 10px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
            white-space: nowrap;
            position: sticky;
            top: 0;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .match {
            background: #d4edda;
        }

        .nomatch {
            background: #f8d7da;
        }

        .issues {
            margin-top: 30px;
            padding: 20px;
            background: #fff3cd;
            border-radius: 6px;
            border-left: 4px solid #ffc107;
        }

        .issues h3 {
            margin-bottom: 15px;
            color: #856404;
        }

        .issue-list {
            list-style: none;
            font-size: 13px;
        }

        .issue-list li {
            padding: 8px;
            margin-bottom: 8px;
            background: white;
            border-radius: 4px;
            border-left: 3px solid #ffc107;
            padding-left: 12px;
        }

        @media (max-width: 1000px) {
            .content {
                grid-template-columns: 1fr;
            }

            .results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔄 HEAT NO 자동 매칭 도구</h1>
            <p>OT 열처리 파일의 HEAT NO를 정리파일(수출)에 자동으로 입력합니다</p>
        </div>

        <div class="content">
            <!-- 왼쪽: 파일 업로드 및 분석 -->
            <div class="section">
                <h2>1️⃣ 파일 선택 및 분석</h2>

                <div class="file-input">
                    <label>정리파일(수출).xls</label>
                    <input type="file" id="file1" accept=".xls,.xlsx" />
                </div>

                <div class="file-input">
                    <label>OT 열처리.xls</label>
                    <input type="file" id="file2" accept=".xls,.xlsx" />
                </div>

                <div class="file-input">
                    <label>📦 원재료 조회 파일 (선택사항)</label>
                    <input type="file" id="file3" accept=".xls,.xlsx" />
                    <small style="color: #999;">SF가 아닌 HEAT NO를 처리하기 위해 원재료 정보 파일을 선택할 수 있습니다</small>
                </div>

                <button onclick="analyzeFiles()">📊 파일 분석하기</button>

                <div id="status" class="status" style="display:none;"></div>

                <div id="results" class="results" style="display:none;">
                    <div class="stat-box">
                        <div class="stat-number" id="stat1">0</div>
                        <div class="stat-label">OT 열처리 항목</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="stat2">0</div>
                        <div class="stat-label">매칭 성공</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="stat3">0</div>
                        <div class="stat-label">매칭 실패</div>
                    </div>
                </div>
            </div>

            <!-- 오른쪽: 매칭 결과 -->
            <div class="section">
                <h2>2️⃣ 매칭 결과 미리보기</h2>

                <div id="debugInfo" style="display:none; background: #f0f0f0; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 12px; max-height: 150px; overflow-y: auto;">
                    <strong>🔍 디버그 정보:</strong>
                    <div id="debugContent"></div>
                </div>

                <div id="previewContainer" style="display:none;">
                    <div style="display: flex; gap: 10px; margin-bottom: 15px; align-items: center;">
                        <label style="margin: 0;">미리보기 행 수:</label>
                        <select id="previewRowCount" style="padding: 6px; border: 1px solid #e0e0e0; border-radius: 4px;">
                            <option value="5">5개</option>
                            <option value="10" selected>10개</option>
                            <option value="20">20개</option>
                            <option value="50">50개</option>
                            <option value="all">전체</option>
                        </select>
                    </div>
                    <div class="preview-table">
                        <table id="previewTable">
                            <thead>
                                <tr>
                                    <th onclick="sortTable('manufNo')" style="cursor: pointer; user-select: none;">
                                        제조번호 <span id="sortIcon-manufNo"></span>
                                    </th>
                                    <th onclick="sortTable('jobNo')" style="cursor: pointer; user-select: none;">
                                        작업번호 <span id="sortIcon-jobNo"></span>
                                    </th>
                                    <th onclick="sortTable('wireSize')" style="cursor: pointer; user-select: none;">
                                        선경 <span id="sortIcon-wireSize"></span>
                                    </th>
                                    <th onclick="sortTable('company')" style="cursor: pointer; user-select: none;">
                                        거래처 <span id="sortIcon-company"></span>
                                    </th>
                                    <th onclick="sortTable('heatNo')" style="cursor: pointer; user-select: none;">
                                        HEAT NO <span id="sortIcon-heatNo"></span>
                                    </th>
                                    <th onclick="sortTable('status')" style="cursor: pointer; user-select: none;">
                                        상태 <span id="sortIcon-status"></span>
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                            </tbody>
                        </table>
                    </div>
                    <small style="color: #999; margin-top: 10px; display: block;">* 상위 10개만 표시됩니다 (전체: <span id="totalMatched">0</span>개)</small>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button onclick="downloadResult()" id="downloadBtn" style="display:none; flex: 1;">
                        💾 결과 다운로드
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        let analysisData = null;

        async function analyzeFiles() {
            const file1 = document.getElementById('file1').files[0];
            const file2 = document.getElementById('file2').files[0];
            const file3 = document.getElementById('file3').files[0];

            if (!file1 || !file2) {
                showStatus('두 파일을 모두 선택해주세요', 'error');
                return;
            }

            showStatus('📁 파일 로드 중...', 'loading');

            try {
                // 파일 유효성 검증
                if (file1.size === 0 || file2.size === 0) {
                    showStatus('❌ 오류: 빈 파일입니다. 유효한 Excel 파일을 선택해주세요.', 'error');
                    return;
                }

                showStatus('📁 정리파일(수출) 읽는 중...', 'loading');
                const data1 = await readExcel(file1);

                showStatus('📁 OT 열처리 파일 읽는 중...', 'loading');
                const data2 = await readExcel(file2);

                let data3 = null;
                if (file3) {
                    showStatus('📁 원재료 조회 파일 읽는 중...', 'loading');
                    data3 = await readExcel(file3);
                }

                showStatus('🔄 데이터 매칭 중...', 'loading');

                // 데이터 유효성 검증
                if (!data1 || data1.length < 2) {
                    showStatus('❌ 오류: 정리파일(수출)이 비어있거나 형식이 잘못되었습니다.', 'error');
                    return;
                }

                if (!data2 || data2.length < 2) {
                    showStatus('❌ 오류: OT 열처리 파일이 비어있거나 형식이 잘못되었습니다.', 'error');
                    return;
                }

                // 필수 컬럼 확인
                const headers1 = data1[0];
                const headers2 = data2[0];

                if (headers1.indexOf('제조번호') === -1) {
                    showStatus('❌ 오류: 정리파일에 "제조번호" 컬럼이 없습니다.', 'error');
                    return;
                }

                if (headers2.indexOf('제조번호') === -1 || headers2.indexOf('HEAT NO') === -1) {
                    showStatus('❌ 오류: OT 열처리 파일에 필수 컬럼이 없습니다.', 'error');
                    return;
                }

                analysisData = matchData(data1, data2, data3);
                displayResults(analysisData);

                showStatus('✅ 분석 완료! 매칭 결과를 확인하세요.', 'success');
                document.getElementById('downloadBtn').style.display = 'block';
            } catch (error) {
                showStatus('❌ 파일 처리 오류: ' + error.message, 'error');
            }
        }

        async function readExcel(file) {
            return new Promise((resolve, reject) => {
                // 파일 형식 검증
                const validExtensions = ['.xls', '.xlsx', '.csv'];
                const fileName = file.name.toLowerCase();
                const isValidFormat = validExtensions.some(ext => fileName.endsWith(ext));

                if (!isValidFormat) {
                    reject(new Error(`지원하지 않는 파일 형식입니다. 지원 형식: ${validExtensions.join(', ')}`));
                    return;
                }

                const reader = new FileReader();

                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);

                        // XLSX 읽기 옵션 개선
                        const workbook = XLSX.read(data, {
                            type: 'array',
                            defval: ''  // 빈 셀을 빈 문자열로 처리
                        });

                        if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
                            reject(new Error('시트가 없는 파일입니다.'));
                            return;
                        }

                        const sheet = workbook.Sheets[workbook.SheetNames[0]];

                        if (!sheet) {
                            reject(new Error('첫 번째 시트를 읽을 수 없습니다.'));
                            return;
                        }

                        const json = XLSX.utils.sheet_to_json(sheet, {
                            header: 1,
                            defval: ''  // 빈 셀을 빈 문자열로 처리
                        });

                        if (!json || json.length === 0) {
                            reject(new Error('파일에서 데이터를 읽을 수 없습니다. 올바른 Excel 파일인지 확인하세요.'));
                            return;
                        }

                        resolve(json);
                    } catch (error) {
                        reject(new Error(`파일 파싱 오류: ${error.message}`));
                    }
                };

                reader.onerror = () => {
                    reject(new Error(`파일 읽기 오류: ${reader.error}`));
                };

                reader.onabort = () => {
                    reject(new Error('파일 읽기가 중단되었습니다.'));
                };

                reader.readAsArrayBuffer(file);
            });
        }

        function matchData(data1, data2, data3) {
            // 헤더 유효성 검증
            if (!data1 || !data1[0] || data1[0].length === 0) {
                throw new Error('정리파일의 헤더가 비어있습니다.');
            }

            if (!data2 || !data2[0] || data2[0].length === 0) {
                throw new Error('OT 열처리 파일의 헤더가 비어있습니다.');
            }

            const headers1 = data1[0];
            const headers2 = data2[0];

            // 정리파일 컬럼 인덱스
            const col1_manuf = headers1.indexOf('제조번호');
            const col1_heat = headers1.indexOf('비고2(HEAT)');
            const col1_spec = headers1.indexOf('강종');
            const col1_wireSize = headers1.indexOf('선경(MM)');
            const col1_company = headers1.indexOf('거래처');

            // OT 파일 컬럼 인덱스
            const col2_manuf = headers2.indexOf('제조번호');
            const col2_heat = headers2.indexOf('HEAT NO');
            const col2_spec = headers2.indexOf('강종');
            const col2_wireSize = headers2.indexOf('선경');
            const col2_rodmaker = headers2.indexOf('ROD MAKER');
            const col2_jobNo = headers2.indexOf('작업번호');  // 작업번호 컬럼

            // 필수 컬럼 검증
            if (col1_manuf === -1) {
                throw new Error('정리파일에서 "제조번호" 컬럼을 찾을 수 없습니다.');
            }

            if (col2_manuf === -1 || col2_heat === -1) {
                throw new Error('OT 열처리 파일에서 필수 컬럼(제조번호, HEAT NO)을 찾을 수 없습니다.');
            }

            // 원재료 조회 파일 컬럼 인덱스
            let col3_rodmaker = -1, col3_spec = -1, col3_heat = -1;
            if (data3) {
                const headers3 = data3[0];
                col3_rodmaker = headers3.indexOf('RODMAKER');
                col3_spec = headers3.indexOf('강종');
                col3_heat = headers3.indexOf('HEAT NO');

                // 컬럼이 없으면 다른 이름으로 시도
                if (col3_rodmaker === -1) col3_rodmaker = headers3.indexOf('공급사');
                if (col3_spec === -1) col3_spec = headers3.indexOf('품번');
            }

            const matches = [];

            // OT 파일을 기준으로 미리보기 데이터 생성 (WL 제외)
            for (let i = 1; i < data2.length; i++) {
                // 작업번호가 'WL'로 시작하면 건너뛰기
                const jobNo = col2_jobNo >= 0 ? data2[i][col2_jobNo] : null;
                if (jobNo && jobNo.toString().startsWith('WL')) {
                    continue;
                }

                const otManuf = data2[i][col2_manuf];
                const otJobNo = data2[i][col2_jobNo];
                const otWireSize = data2[i][col2_wireSize];
                const otCompany = data2[i][4];  // 거래처 (컬럼 5)
                const otHeatNo = data2[i][col2_heat];
                const otSpec = data2[i][col2_spec];

                // 정리파일에서 같은 제조번호가 있는지 확인 (정리파일 업데이트용)
                let matchedInFile = false;
                for (let j = 1; j < data1.length; j++) {
                    const fileManuf = data1[j][col1_manuf];
                    const fileSpec = data1[j][col1_spec];

                    if (fileManuf && fileManuf.toString() === otManuf.toString()) {
                        // 강종도 비교해서 최종 확인
                        const fileSpecClean = fileSpec.toString().replace(/[^0-9]/g, '');
                        const otSpecClean = otSpec.toString().replace(/[^0-9]/g, '');
                        if (fileSpecClean && otSpecClean && fileSpecClean === otSpecClean) {
                            matchedInFile = true;
                            break;
                        }
                    }
                }

                matches.push({
                    manufNo: otManuf,
                    jobNo: otJobNo,
                    wireSize: otWireSize,
                    company: otCompany,
                    heatNo: otHeatNo,
                    status: matchedInFile ? '✅ 정리파일에 존재' : '⚠️ 신규',
                    rowIndex: i,
                    matched: true
                });
            }

            return {
                headers1, data1,
                matches,
                colIndices: {
                    manuf: col1_manuf,
                    heat: col1_heat,
                    spec: col1_spec,
                    wireSize: col1_wireSize
                }
            };
        }

        function findHeatNoFromRawMaterial(data3, col3_rodmaker, col3_spec, col3_heat, spec) {
            // 포스코 원재료에서 강종과 일치하는 HEAT NO 찾기
            for (let i = 1; i < data3.length; i++) {
                const rodmaker = data3[i][col3_rodmaker];
                const rawSpec = data3[i][col3_spec];
                const heatNo = data3[i][col3_heat];

                // 포스코이고 강종이 일치하면
                if (rodmaker && rodmaker.toString().includes('포스코') && rawSpec === spec && heatNo) {
                    return heatNo;
                }
            }
            return null;
        }

        // 정렬 상태 추적
        let sortState = {
            column: null,
            direction: 'asc'
        };
        let currentAnalysisData = null;

        function sortTable(column) {
            // 같은 컬럼 클릭시 방향 토글
            if (sortState.column === column) {
                sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortState.column = column;
                sortState.direction = 'asc';
            }

            // 정렬 아이콘 업데이트
            updateSortIcons();

            // 테이블 다시 렌더링
            updatePreviewTable();
        }

        function updateSortIcons() {
            // 모든 정렬 아이콘 초기화
            ['manufNo', 'jobNo', 'wireSize', 'company', 'heatNo', 'status'].forEach(col => {
                const el = document.getElementById(`sortIcon-${col}`);
                if (el) el.textContent = '';
            });

            // 현재 정렬 컬럼 아이콘 표시
            if (sortState.column) {
                const icon = sortState.direction === 'asc' ? '↑' : '↓';
                const el = document.getElementById(`sortIcon-${sortState.column}`);
                if (el) el.textContent = icon;
            }
        }

        function displayResults(data) {
            currentAnalysisData = data;
            const matched = data.matches.length;

            document.getElementById('stat1').textContent = data.matches.length;
            document.getElementById('stat2').textContent = matched;
            document.getElementById('stat3').textContent = '0';
            document.getElementById('results').style.display = 'grid';

            // 디버그 정보 표시
            const debugContent = document.getElementById('debugContent');
            const uniqueHeatNos = new Set(data.matches.map(m => m.heatNo).filter(h => h));
            const uniqueManuf = new Set(data.matches.map(m => m.manufNo));
            const emptyHeatNos = data.matches.filter(m => !m.heatNo || m.heatNo.trim() === '').length;

            debugContent.innerHTML = `
                <div>📊 OT 열처리 데이터: ${data.matches.length}개</div>
                <div>🔗 제조번호 종류: ${uniqueManuf.size}개</div>
                <div>🌡️ HEAT NO 종류: ${uniqueHeatNos.size}개 ${emptyHeatNos > 0 ? `<span style="color: #ff6b6b;">+ 빈값 ${emptyHeatNos}개 ⚠️</span>` : ''}</div>
                <div style="margin-top: 8px; color: #666;">
                    ${Array.from(uniqueHeatNos).slice(0, 5).map(h => `<span style="display: inline-block; background: #e0e0e0; padding: 2px 6px; margin: 2px; border-radius: 3px;">${h}</span>`).join('')}
                    ${uniqueHeatNos.size > 5 ? `<span style="display: inline-block; color: #999;">... 외 ${uniqueHeatNos.size - 5}개</span>` : ''}
                    ${emptyHeatNos > 0 ? `<span style="display: inline-block; background: #ffe0e0; padding: 2px 6px; margin: 2px; border-radius: 3px; color: #ff6b6b;">[빈값]</span>` : ''}
                </div>
            `;
            document.getElementById('debugInfo').style.display = 'block';

            // 미리보기 테이블 업데이트 함수
            function updatePreviewTable() {
                const rowCount = document.getElementById('previewRowCount').value;
                const tableBody = document.getElementById('tableBody');
                tableBody.innerHTML = '';

                let sampleItems;
                if (rowCount === 'all') {
                    sampleItems = [...data.matches];
                } else {
                    sampleItems = getDistributedSamples(data.matches, parseInt(rowCount));
                }

                // 정렬 적용
                if (sortState.column) {
                    sampleItems.sort((a, b) => {
                        let aVal = a[sortState.column] || '';
                        let bVal = b[sortState.column] || '';

                        // 숫자 비교
                        if (!isNaN(aVal) && !isNaN(bVal)) {
                            aVal = parseFloat(aVal);
                            bVal = parseFloat(bVal);
                        } else {
                            // 문자열 비교 (한글 포함)
                            aVal = String(aVal).toLowerCase();
                            bVal = String(bVal).toLowerCase();
                        }

                        if (aVal < bVal) return sortState.direction === 'asc' ? -1 : 1;
                        if (aVal > bVal) return sortState.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }

                sampleItems.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = 'match';
                    row.innerHTML = `
                        <td>${item.manufNo || '-'}</td>
                        <td>${item.jobNo || '-'}</td>
                        <td>${item.wireSize || '-'}</td>
                        <td>${item.company || '-'}</td>
                        <td><strong>${item.heatNo || '-'}</strong></td>
                        <td>${item.status || '-'}</td>
                    `;
                    tableBody.appendChild(row);
                });
            }

            // 초기 테이블 표시
            updatePreviewTable();

            // 행 수 선택 이벤트
            document.getElementById('previewRowCount').addEventListener('change', updatePreviewTable);

            document.getElementById('totalMatched').textContent = matched;
            document.getElementById('previewContainer').style.display = 'block';
            document.getElementById('downloadBtn').style.display = 'block';
        }

        function getDistributedSamples(items, count) {
            if (items.length <= count) return items;

            // 다양한 HEAT NO를 균등하게 샘플링
            const step = Math.floor(items.length / count);
            const samples = [];
            for (let i = 0; i < count && i * step < items.length; i++) {
                samples.push(items[i * step]);
            }
            return samples;
        }

        function downloadResult() {
            if (!analysisData) {
                showStatus('❌ 오류: 분석 데이터가 없습니다. 먼저 파일을 분석해주세요.', 'error');
                return;
            }

            if (!analysisData.matches || analysisData.matches.length === 0) {
                showStatus('❌ 오류: 매칭된 결과가 없습니다.', 'error');
                return;
            }

            // 옵션 선택
            const option = confirm(
                '다운로드 방식을 선택하세요.\n\n' +
                '확인: 새로운 파일 (HEAT NO만 추가된 정리파일)\n' +
                '취소: 매칭 결과만 (제조번호, 작업번호, 거래처, HEAT NO)'
            );

            if (option) {
                downloadFullFile();
            } else {
                downloadMatchesOnly();
            }
        }

        function downloadFullFile() {
            try {
                if (!analysisData) {
                    showStatus('❌ 오류: 분석 데이터가 없습니다. 먼저 파일을 분석해주세요.', 'error');
                    return;
                }

                // 원본 파일 구조 유지하며 HEAT NO만 추가
                const newData = analysisData.data1.map(row => [...row]);
                const heatColIdx = analysisData.colIndices.heat;
                const manufColIdx = analysisData.colIndices.manuf || 0;  // 제조번호 컬럼 인덱스

                // col1_heat가 -1이면 새로운 컬럼으로 추가
                if (heatColIdx === -1) {
                    // 헤더에 HEAT NO 추가
                    if (newData[0]) {
                        newData[0].push('비고2(HEAT)');
                    }

                    // 매칭 결과를 정리파일 제조번호 기준으로 추가
                    analysisData.matches.forEach(match => {
                        for (let i = 1; i < newData.length; i++) {
                            if (newData[i][manufColIdx] &&
                                newData[i][manufColIdx].toString() === match.manufNo.toString()) {
                                newData[i].push(match.heatNo || '');
                                break;  // 같은 제조번호는 한 번만 처리
                            }
                        }
                    });
                } else {
                    // col1_heat가 유효한 경우 (기존 HEAT NO 컬럼 업데이트)
                    analysisData.matches.forEach(match => {
                        for (let i = 1; i < newData.length; i++) {
                            if (newData[i][manufColIdx] &&
                                newData[i][manufColIdx].toString() === match.manufNo.toString()) {
                                newData[i][heatColIdx] = match.heatNo || '';
                                break;  // 같은 제조번호는 한 번만 처리
                            }
                        }
                    });
                }

                const ws = XLSX.utils.aoa_to_sheet(newData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "정리파일(수출)");
                XLSX.writeFile(wb, `정리파일(수출)_HEAT처리_${new Date().getTime()}.xlsx`);

                showStatus('✅ 새로운 정리파일을 다운로드했습니다! (원본 파일 보존됨)', 'success');
            } catch (error) {
                console.error('다운로드 오류:', error);
                showStatus(`❌ 다운로드 오류: ${error.message}`, 'error');
            }
        }

        function downloadMatchesOnly() {
            try {
                if (!analysisData) {
                    showStatus('❌ 오류: 분석 데이터가 없습니다. 먼저 파일을 분석해주세요.', 'error');
                    return;
                }

                if (!analysisData.matches || analysisData.matches.length === 0) {
                    showStatus('❌ 오류: 매칭된 결과가 없습니다.', 'error');
                    return;
                }

                // 매칭 결과만 정리
                const headers = ['제조번호', '작업번호', '거래처', 'HEAT NO', '상태'];
                const data = [headers];

                analysisData.matches.forEach(match => {
                    data.push([
                        match.manufNo || '',
                        match.jobNo || '',
                        match.company || '',
                        match.heatNo || '',
                        '✅ 매칭됨'
                    ]);
                });

                const ws = XLSX.utils.aoa_to_sheet(data);
                // 컬럼 너비 설정
                ws['!cols'] = [
                    { wch: 15 },  // 제조번호
                    { wch: 15 },  // 작업번호
                    { wch: 20 },  // 거래처
                    { wch: 15 },  // HEAT NO
                    { wch: 15 }   // 상태
                ];

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "매칭결과");
                XLSX.writeFile(wb, `HEAT_NO_매칭결과_${new Date().getTime()}.xlsx`);

                showStatus('✅ 매칭 결과를 다운로드했습니다!', 'success');
            } catch (error) {
                console.error('다운로드 오류:', error);
                showStatus(`❌ 다운로드 오류: ${error.message}`, 'error');
            }
        }

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }

    </script>
</body>
</html>
