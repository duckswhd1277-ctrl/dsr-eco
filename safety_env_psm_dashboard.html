<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안전/환경/PSM 통합 관리 대시보드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #1a1a1a;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 28px;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .dashboard-grid.full-width {
            grid-template-columns: 1fr;
        }

        .dashboard-grid.three-columns {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-section {
            margin-bottom: 1rem;
        }

        .progress-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 0.3rem;
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 18px;
            background: #f0f0f0;
            border-radius: 9px;
            overflow: hidden;
            margin-bottom: 0.3rem;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: white;
            transition: width 0.3s ease;
        }

        .progress-env .progress-fill {
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
        }

        .progress-safety .progress-fill {
            background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%);
        }

        .progress-psm .progress-fill {
            background: linear-gradient(90deg, #3b82f6 0%, #1d4ed8 100%);
        }

        .progress-total .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .progress-percent {
            text-align: right;
            font-size: 13px;
            font-weight: 600;
            color: #666;
        }

        /* 새로운 달력 그리드 스타일 */
        .calendar-container {
            width: 100%;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #ddd;
            margin-bottom: 1px;
        }

        .calendar-weekday {
            background: #f0f0f0;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            color: #333;
            font-size: 14px;
            text-transform: uppercase;
        }

        .calendar-weekday.sunday {
            color: #ef4444;
        }

        .calendar-weekday.saturday {
            color: #3b82f6;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #ddd;
        }

        .calendar-day {
            background: white;
            min-height: 120px;
            padding: 8px;
            text-align: left;
            vertical-align: top;
            position: relative;
            overflow: hidden;
        }

        .calendar-day.other-month {
            background: #fafafa;
            color: #ccc;
        }

        .calendar-day.today {
            background: #fffbeb;
        }

        .calendar-day.sunday {
            background: #fff5f5;
        }

        .calendar-day.saturday {
            background: #f0f9ff;
        }

        .calendar-date {
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
            font-size: 15px;
        }

        .calendar-day.sunday .calendar-date {
            color: #ef4444;
        }

        .calendar-day.saturday .calendar-date {
            color: #3b82f6;
        }

        .calendar-events {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-height: 90px;
            overflow-y: auto;
        }

        .calendar-events::-webkit-scrollbar {
            width: 4px;
        }

        .calendar-events::-webkit-scrollbar-track {
            background: transparent;
        }

        .calendar-events::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 2px;
        }

        .calendar-event {
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 3px;
            color: white;
            word-break: break-word;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .calendar-event.env {
            background: #10b981;
        }

        .calendar-event.safety {
            background: #f59e0b;
        }

        .calendar-event.psm {
            background: #3b82f6;
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            gap: 1rem;
        }

        .month-nav button {
            background: #f0f0f0;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: #667eea;
            transition: background 0.2s;
            flex: 0 0 auto;
        }

        .month-nav button:hover {
            background: #e0e0e0;
        }

        .month-display {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            text-align: center;
            flex: 1;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #f0f0f0;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .checkbox-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .checkbox-item:hover {
            background: #f0f0f0;
        }

        .checkbox-item input {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-item label {
            flex: 1;
            cursor: pointer;
            font-size: 14px;
        }

        .checkbox-item input:checked ~ label {
            color: #10b981;
            font-weight: 600;
        }

        button.btn {
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #667eea;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-completed {
            background: #d1fae5;
            color: #065f46;
        }

        .documents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }

        .document-card {
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .document-card:hover {
            border-color: #667eea;
            background: #f8f7ff;
        }

        .document-icon {
            font-size: 32px;
            margin-bottom: 0.5rem;
        }

        .document-name {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            word-break: break-word;
        }

        .settings-section {
            margin-bottom: 2rem;
            padding: 1rem;
            background: #f9f9f9;
            border-radius: 6px;
        }

        .settings-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #333;
        }

        .deadline-item {
            display: grid;
            grid-template-columns: 1fr 100px;
            gap: 1rem;
            align-items: center;
            padding: 0.75rem;
            background: white;
            border-radius: 6px;
            margin-bottom: 0.75rem;
            border: 1px solid #ddd;
        }

        .deadline-label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .deadline-input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        /* #9: 할일 리스트 스크롤 개선 */
        .checkbox-list {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .checkbox-list::-webkit-scrollbar {
            width: 6px;
        }

        .checkbox-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .checkbox-list::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }

        .checkbox-list::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* #3: 모바일 반응형 레이아웃 개선 */
        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-grid.three-columns {
                grid-template-columns: 1fr 1fr;
            }

        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 20px;
            }

            .dashboard-grid.three-columns {
                grid-template-columns: 1fr;
            }

            .mini-stats {
                grid-template-columns: 1fr;
            }

            .calendar-weekday {
                font-size: 12px;
                padding: 8px;
            }

            .calendar-day {
                min-height: 80px;
                padding: 6px;
                font-size: 12px;
            }

            .calendar-date {
                font-size: 13px;
            }

            .calendar-event {
                font-size: 10px;
                padding: 2px 4px;
            }

            .month-nav {
                flex-direction: column;
                gap: 1rem;
            }

            .documents-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                max-width: 100%;
            }

            .header {
                padding: 1rem;
                margin-bottom: 1rem;
            }

            .header h1 {
                font-size: 16px;
            }

            .header p {
                font-size: 12px;
            }

            .card {
                padding: 1rem;
            }

            .card-title {
                font-size: 16px;
            }

            .tabs {
                gap: 5px;
                margin-bottom: 1rem;
            }

            .tab {
                padding: 8px 12px;
                font-size: 12px;
            }

            .btn {
                padding: 10px 12px;
                font-size: 12px;
            }

            .checkbox-item {
                padding: 8px;
                font-size: 13px;
            }

            .form-group label {
                font-size: 12px;
            }

            .form-group input,
            .form-group select {
                font-size: 14px;
                padding: 8px;
            }

            .checkbox-list {
                max-height: 300px;
            }
        }

    </style>
</head>
<body>
    <div class="container" role="main" aria-label="안전/환경/PSM 통합 관리 대시보드">
        <!-- 헤더 -->
        <header class="header">
            <h1>⚙️ 안전/환경/PSM 통합 관리 대시보드</h1>
            <p>율촌총무관리팀</p>
        </header>

        <!-- #7: 제출 기한 경고 영역 -->
        <div id="deadlineWarnings" style="margin-bottom: 2rem;"></div>

        <!-- 캘린더 (풀 너비) -->
        <div class="dashboard-grid full-width">
            <div class="card">
                <div class="card-title">📅 월간 캘린더</div>
                <div class="month-nav">
                    <button onclick="prevMonth()">◀ 이전</button>
                    <span class="month-display" id="monthDisplay">2026년 6월</span>
                    <button onclick="nextMonth()">다음 ▶</button>
                </div>
                <div class="calendar-container" id="calendar"></div>
            </div>
        </div>

        <!-- 진행률 (풀 너비) -->
        <div class="dashboard-grid full-width">
            <div class="card">
                <div class="card-title">📊 월간 진행률</div>

                <div class="progress-section progress-env">
                    <div class="progress-title">환경 관리</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressEnv" style="width: 0%;">0%</div>
                    </div>
                    <div class="progress-percent" id="percentEnv">0/0</div>
                </div>

                <div class="progress-section progress-safety">
                    <div class="progress-title">안전 관리</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressSafety" style="width: 0%;">0%</div>
                    </div>
                    <div class="progress-percent" id="percentSafety">0/0</div>
                </div>

                <div class="progress-section progress-psm">
                    <div class="progress-title">PSM 관리</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressPsm" style="width: 0%;">0%</div>
                    </div>
                    <div class="progress-percent" id="percentPsm">0/0</div>
                </div>

                <div class="progress-section progress-total">
                    <div class="progress-title">🎯 전체 진행률</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressTotal" style="width: 0%;">0%</div>
                    </div>
                    <div class="progress-percent" id="percentTotal">0/0</div>
                </div>
            </div>
        </div>

        <!-- 할일/문서/설정 (3열) -->
        <div class="dashboard-grid three-columns">
            <!-- 할일 관리 -->
            <div class="card">
                <div class="card-title">✅ 할일 관리</div>

                <div class="tabs" role="tablist" aria-label="할일 카테고리">
                    <button class="tab active" onclick="switchTab('task-all')" role="tab" aria-selected="true" aria-controls="task-all">전체</button>
                    <button class="tab" onclick="switchTab('task-env')" role="tab" aria-selected="false" aria-controls="task-env">환경</button>
                    <button class="tab" onclick="switchTab('task-safety')" role="tab" aria-selected="false" aria-controls="task-safety">안전</button>
                    <button class="tab" onclick="switchTab('task-psm')" role="tab" aria-selected="false" aria-controls="task-psm">PSM</button>
                </div>

                <div id="task-all" class="tab-content active">
                    <div class="checkbox-list" id="taskListAll"></div>
                </div>
                <div id="task-env" class="tab-content">
                    <div class="checkbox-list" id="taskListEnv"></div>
                </div>
                <div id="task-safety" class="tab-content">
                    <div class="checkbox-list" id="taskListSafety"></div>
                </div>
                <div id="task-psm" class="tab-content">
                    <div class="checkbox-list" id="taskListPsm"></div>
                </div>

            </div>

            <!-- 문서 라이브러리 -->
            <div class="card">
                <div class="card-title">📚 문서 라이브러리</div>
                <div class="documents-grid" id="documentsList"></div>
                <button class="btn btn-secondary" onclick="addDocumentModal()" style="width: 100%; margin-top: 1rem;">➕ 문서 추가</button>
            </div>

            <!-- Excel 관리 -->
            <div class="card">
                <div class="card-title">📊 Excel 일정 관리</div>

                <!-- Excel 다운로드 -->
                <div class="settings-section">
                    <div class="settings-title">📥 Excel 양식 다운로드</div>
                    <p style="font-size: 13px; color: #666; margin-bottom: 1rem;">
                        환경/안전/PSM 일정을 작성할 수 있는 Excel 양식을 다운로드합니다.
                    </p>
                    <button class="btn btn-primary" onclick="downloadExcelTemplate()" style="width: 100%;">
                        📥 Excel 양식 다운로드
                    </button>
                </div>

                <!-- Excel 업로드 -->
                <div class="settings-section">
                    <div class="settings-title">📤 Excel 파일 업로드</div>
                    <div id="uploadDropZone" style="border: 2px dashed #667eea; border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; background: #f8f7ff; transition: all 0.3s; margin-bottom: 1rem;" onmouseover="this.style.background='#f0ebff'" onmouseout="this.style.background='#f8f7ff'" ondrop="handleDropZone(event)" ondragover="event.preventDefault()">
                        <div style="font-size: 24px; margin-bottom: 0.5rem;">📂</div>
                        <div style="font-size: 14px; font-weight: 600; color: #667eea; margin-bottom: 0.3rem;">
                            Excel 파일을 드래그해서 놓으세요
                        </div>
                        <div style="font-size: 12px; color: #999;">
                            또는 아래 버튼으로 파일을 선택하세요
                        </div>
                    </div>
                    <input type="file" id="excelFileInput" accept=".xlsx,.xls,.csv" style="display: none;" onchange="handleExcelUpload(event)">
                    <button class="btn btn-secondary" onclick="document.getElementById('excelFileInput').click();" style="width: 100%;">
                        파일 선택
                    </button>
                    <div id="uploadStatus" style="margin-top: 1rem; font-size: 13px;"></div>
                </div>

                <button class="btn btn-secondary" onclick="exportData()" style="width: 100%; margin-top: 1rem;">📥 데이터 내보내기 (CSV)</button>
            </div>
        </div>
    </div>

    <!-- 모달 -->
    <div id="modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; overflow-y: auto;" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
        <div style="background: white; border-radius: 12px; padding: 2rem; max-width: 500px; width: 90%; margin: 2rem auto;">
            <h2 style="margin-bottom: 1rem;" id="modalTitle">새 항목 추가</h2>
            <div id="modalContent"></div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button class="btn btn-secondary" onclick="closeModal()" style="flex: 1;" aria-label="모달 취소">취소</button>
                <button class="btn btn-primary" onclick="saveModal()" style="flex: 1;" aria-label="모달 저장">저장</button>
            </div>
        </div>
    </div>

    <script>
        // 데이터 저장소
        let appData = {
            tasks: [],
            documents: [],
            settings: {
                env: '매월 말일',
                safety: '매월 15일',
                psm: '월중순'
            }
        };

        let currentMonth = new Date();
        let modalType = '';

        // 초기화
        function init() {
            loadData();
            renderCalendar();
            renderTasks();
            renderDocuments();
            updateProgress();
            checkDeadlines(); // #7: 제출 기한 경고
        }

        // 데이터 로드
        function loadData() {
            const saved = localStorage.getItem('dashboardData');
            if (saved) {
                appData = JSON.parse(saved);
            }
        }

        // 데이터 저장
        function saveData() {
            localStorage.setItem('dashboardData', JSON.stringify(appData));
            updateProgress();
            renderTasks();
            renderCalendar();
            checkDeadlines(); // #7: 제출 기한 경고 업데이트
        }

        // 캘린더 셀 높이 동적 조정
        function adjustCalendarHeights() {
            const calendar = document.getElementById('calendar');
            const cells = calendar.querySelectorAll('.calendar-day');

            cells.forEach(cell => {
                const eventCount = cell.querySelectorAll('.calendar-event').length;
                const baseHeight = 120;
                const eventHeight = 20;
                const totalHeight = baseHeight + (eventCount * eventHeight);

                cell.style.minHeight = totalHeight + 'px';
            });
        }

        // 캘린더 렌더링 (한국식 그리드 형식)
        function renderCalendar() {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();

            document.getElementById('monthDisplay').textContent = `${year}.${String(month + 1).padStart(2, '0')}`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const prevLastDay = new Date(year, month, 0);

            // 요일 헤더 생성
            const weekdayNames = ['일', '월', '화', '수', '목', '금', '토'];
            let weekdayHtml = '';
            weekdayNames.forEach((name, index) => {
                const classes = index === 0 ? 'calendar-weekday sunday' : index === 6 ? 'calendar-weekday saturday' : 'calendar-weekday';
                weekdayHtml += `<div class="${classes}">${name}</div>`;
            });

            // 달력 셀 생성
            let calendarHtml = '';

            // 지난 달 날짜
            for (let i = prevLastDay.getDate() - firstDay.getDay() + 1; i <= prevLastDay.getDate(); i++) {
                calendarHtml += `<div class="calendar-day other-month"><span class="calendar-date">${i}</span></div>`;
            }

            // 이번 달 날짜
            for (let i = 1; i <= lastDay.getDate(); i++) {
                const date = new Date(year, month, i);
                const dayOfWeek = date.getDay();
                const isToday = i === new Date().getDate() && month === new Date().getMonth() && year === new Date().getFullYear();

                let dayClasses = 'calendar-day';
                if (isToday) dayClasses += ' today';
                if (dayOfWeek === 0) dayClasses += ' sunday';
                if (dayOfWeek === 6) dayClasses += ' saturday';

                calendarHtml += `<div class="${dayClasses}">
                    <div class="calendar-date">${i}</div>
                    <div class="calendar-events" id="events-${i}"></div>
                </div>`;
            }

            // 다음 달 날짜
            const remainingDays = 6 * 7 - lastDay.getDate() - firstDay.getDay();
            for (let i = 1; i <= remainingDays; i++) {
                const date = new Date(year, month + 1, i);
                const dayOfWeek = date.getDay();

                let dayClasses = 'calendar-day other-month';
                if (dayOfWeek === 0) dayClasses += ' sunday';
                if (dayOfWeek === 6) dayClasses += ' saturday';

                calendarHtml += `<div class="${dayClasses}"><span class="calendar-date">${i}</span></div>`;
            }

            // HTML 업데이트
            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = `<div class="calendar-weekdays">${weekdayHtml}</div><div class="calendar-grid">${calendarHtml}</div>`;

            // 이벤트 추가
            appData.tasks.forEach(task => {
                if (task.date) {
                    const date = new Date(task.date);
                    if (date.getFullYear() === year && date.getMonth() === month) {
                        const day = date.getDate();
                        const el = document.getElementById(`events-${day}`);
                        if (el) {
                            el.innerHTML += `<div class="calendar-event ${task.category}" title="${task.name}">${task.name}</div>`;
                        }
                    }
                }
            });

            // 캘린더 셀 높이 동적 조정
            adjustCalendarHeights();
        }

        // 진행률 업데이트
        function updateProgress() {
            const updateProgressBar = (category) => {
                const tasks = appData.tasks.filter(t => t.category === category);
                const completed = tasks.filter(t => t.completed).length;
                const total = tasks.length;
                const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

                const progressEl = document.getElementById(`progress${category.charAt(0).toUpperCase() + category.slice(1)}`);
                const percentEl = document.getElementById(`percent${category.charAt(0).toUpperCase() + category.slice(1)}`);
                const statEl = document.getElementById(`stat${category.charAt(0).toUpperCase() + category.slice(1)}`);

                if (progressEl) {
                    progressEl.style.width = percent + '%';
                    progressEl.textContent = percent + '%';
                }
                if (percentEl) percentEl.textContent = `${completed}/${total}`;
                if (statEl) statEl.textContent = `${completed}/${total}`;

                return { completed, total, percent };
            };

            const env = updateProgressBar('env');
            const safety = updateProgressBar('safety');
            const psm = updateProgressBar('psm');

            const totalTasks = env.total + safety.total + psm.total;
            const totalCompleted = env.completed + safety.completed + psm.completed;
            const totalPercent = totalTasks === 0 ? 0 : Math.round((totalCompleted / totalTasks) * 100);

            const progressTotal = document.getElementById('progressTotal');
            const percentTotal = document.getElementById('percentTotal');

            if (progressTotal) {
                progressTotal.style.width = totalPercent + '%';
                progressTotal.textContent = totalPercent + '%';
            }
            if (percentTotal) percentTotal.textContent = `${totalCompleted}/${totalTasks}`;
        }

            const category = document.getElementById('taskCategory').value;
            const date = document.getElementById('taskDate').value;

            // #8: 폼 유효성 검증

                return;

            // #5: 중복 항목 추가 방지
            if (modalType === 'addTask' && checkDuplicate(name, date)) {
                alert('같은 날짜에 같은 항목이 이미 존재합니다.');
                return;
            }

            if (modalType === 'addTask') {
                appData.tasks.push({
                    id: appData.tasks.length > 0 ? Math.max(...appData.tasks.map(t => t.id)) + 1 : 1,
                    name,
                    category,
                    date,
                    completed: false
                });

                    task.category = category;

        // #8: 폼 유효성 검증 (강화됨)
        function validateForm(name, date) {
            // 1️⃣ 빈 값 확인
            if (!name || name.trim().length === 0) {
                alert('항목명을 입력해주세요.');
                return false;
            }

            // 2️⃣ 공백만 입력된 경우 거부
            if (name.trim() !== name) {
                alert('항목명 앞뒤에 공백을 제거해주세요.');
                return false;
            }

            // 3️⃣ 최소 길이 (2자 이상)
            if (name.trim().length < 2) {
                alert('항목명은 최소 2자 이상 입력해주세요.');
                return false;
            }

            // 4️⃣ 최대 길이 (100자 이하)
            if (name.length > 100) {
                alert('항목명은 100자 이내로 입력해주세요.');
                return false;
            }

            // 5️⃣ 특수문자 제한 (일반적인 특수문자만 허용)
            const validNameRegex = /^[가-힣a-zA-Z0-9\s\-_()\[\]\.,:;!?]*$/;
            if (!validNameRegex.test(name)) {
                alert('항목명에 허용되지 않는 특수문자가 있습니다.\n(허용: 한글, 영문, 숫자, 공백, 하이픈, 괄호, 점, 쉼표, 콜론, 세미콜론, 느낌표, 물음표)');
                return false;
            }

            // 6️⃣ 날짜 확인
            if (!date) {
                alert('날짜를 선택해주세요.');
                return false;
            }

            // 7️⃣ 날짜 형식 확인
            const dateRegex = /^\d{4}-\d{2}-\d{2}$/;
            if (!dateRegex.test(date)) {
                alert('올바른 날짜 형식이 아닙니다. (YYYY-MM-DD)');
                return false;
            }

            // 8️⃣ 날짜가 과거인 경우 경고 (단, 오늘 포함)
            const selectedDate = new Date(date);
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            if (selectedDate < today) {
                const confirm_past = confirm(`선택한 날짜(${date})는 과거입니다.\n과거 날짜로 추가하시겠습니까?`);
                if (!confirm_past) {
                    return false;
                }
            }

            return true;
        }

        function checkDuplicate(name, date) {
            return appData.tasks.some(t => t.name === name && t.date === date);

        // #7: 제출 기한 경고 함수
        function checkDeadlines() {
            const today = new Date();
            const warnings = [];

            appData.tasks.forEach(task => {
                if (!task.completed && task.date) {
                    const taskDate = new Date(task.date);
                    const daysRemaining = Math.ceil((taskDate - today) / (1000 * 60 * 60 * 24));

                    if (daysRemaining === 7) {
                        warnings.push(`⚠️ D-7: ${task.name} (${task.date})`);
                    } else if (daysRemaining === 3) {
                        warnings.push(`⚠️ D-3: ${task.name} (${task.date})`);
                    } else if (daysRemaining === 0) {
                        warnings.push(`🚨 오늘: ${task.name} (${task.date})`);
                    } else if (daysRemaining < 0) {
                        warnings.push(`❌ 기한초과: ${task.name} (${task.date})`);
                    }
                }
            });

            if (warnings.length > 0) {
                const warningEl = document.getElementById('deadlineWarnings');
                if (warningEl) {
                    warningEl.innerHTML = warnings.map(w => `<div style="padding: 8px; background: #fef3c7; border-left: 3px solid #f59e0b; margin: 8px 0; border-radius: 3px;">${w}</div>`).join('');
                }
            }
        }

        // #15: Excel 파일 업로드 처리
        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const csv = e.target.result;
                    const lines = csv.split('\n').filter(line => line.trim());

                    if (lines.length < 2) {
                        alert('파일에 데이터가 없습니다.');
                        return;
                    }

                    // 헤더 확인
                    const header = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
                    if (header[0] !== '분류' || header[1] !== '항목명' || header[2] !== '날짜') {
                        alert('파일 형식이 올바르지 않습니다. 다운로드한 양식을 사용해주세요.');
                        return;
                    }

                    // 데이터 파싱
                    let addedCount = 0;
                    let duplicateCount = 0;

                    for (let i = 1; i < lines.length; i++) {
                        const cells = lines[i].split(',').map(cell => cell.replace(/"/g, '').trim());
                        if (cells.length < 3 || !cells[0] || !cells[1] || !cells[2]) continue;

                        const category = cells[0];
                        const name = cells[1];
                        const date = cells[2];
                        const description = cells[3] || '';

                        // 카테고리 검증
                        if (!['환경', '안전', 'PSM'].includes(category)) {
                            alert(`${i+1}번째 행의 분류가 올바르지 않습니다. (환경/안전/PSM만 가능)`);
                            return;
                        }

                        // 날짜 형식 검증
                        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
                            alert(`${i+1}번째 행의 날짜 형식이 올바르지 않습니다. (YYYY-MM-DD)`);
                            return;
                        }

                        // 중복 확인
                        if (appData.tasks.some(t => t.name === name && t.date === date)) {
                            duplicateCount++;
                            continue;
                        }

                        // 항목 추가
                        appData.tasks.push({
                            id: appData.tasks.length > 0 ? Math.max(...appData.tasks.map(t => t.id)) + 1 : 1,
                            name: name,
                            category: category === '환경' ? 'env' : category === '안전' ? 'safety' : 'psm',
                            date: date,
                            completed: false
                        });

                        addedCount++;
                    }

                    saveData();

                    let message = `${addedCount}개 항목이 추가되었습니다.`;
                    if (duplicateCount > 0) message += `\n${duplicateCount}개 중복 항목은 제외되었습니다.`;

                    alert(message);
                    document.getElementById('uploadStatus').innerHTML = `<span style="color: #10b981;">✅ ${addedCount}개 항목 추가 완료</span>`;
                    document.getElementById('excelFileInput').value = '';

                } catch (error) {
                    alert('파일을 처리하는 중 오류가 발생했습니다: ' + error.message);
                }
            };

            reader.readAsText(file);
        }
